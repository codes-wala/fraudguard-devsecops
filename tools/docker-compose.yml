# Local DevSecOps tool stack: Jenkins (8080) + SonarQube (9000).
# Start:  docker compose -f tools/docker-compose.yml up -d --build
services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    user: root                      # lab setup: lets Jenkins use the Docker socket
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [devsecops]
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    networks: [devsecops]
volumes:
  jenkins_home:
  sonar_data:
  sonar_logs:
  sonar_extensions:
networks:
  devsecops:
    name: devsecops
